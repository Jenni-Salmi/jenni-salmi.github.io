      <!-- Main -->
      <div id="main-wrapper">
        <div class="container">
          <div id="content">
            <!-- Content -->

            <div class="row contact-row">
              <div>
                <h2>Contact Me</h2>
                <p>
                  Interested in working with me? Please use the contact form
                  below to share some details about your project.
                </p>
                <img
                  src="./images/pens.png"
                  alt="Illustration in green ink and a marker of four different kinds of pens upright in a row, each scribbling a line."
                  style="margin-left: -10px"
                  width="100%"
                />
              </div>

              <div style="width: 100%; flex-grow: 1">
                <div>
                <form action="https://api.web3forms.com/submit" method="POST" class="column">
                  <input
                    type="hidden"
                    name="access_key"
                    value="5543cbd1-6fbc-424c-ac01-de5d07b4957c"
                  />
                  <label>Name</label>
                  <input
                    type="text"
                    name="name"
                    required
                    width="inhert"
                    maxlength="20"
                  />
                  <label>Email</label>
                  <input
                    type="email"
                    name="email"
                    required
                    maxlength="20"
                    pattern="/^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/"
                  />
                  <label>Message</label>
                  <textarea name="message" required maxlength="200"></textarea>
                  <button type="submit">Submit Form</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

     
    </div>
